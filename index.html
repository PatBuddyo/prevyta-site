  :root { --ink:#0E2A33; --cyan:#3CCFEA; --aqua:#3DDBBA; --turq:#3DD5D2; --muted:#56707A; --bg:#F4F8F9; --line:#DDE7EA; --grey:#E9EFF1; --chip:#E4ECEF; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
         display:flex; flex-direction:column; min-height:100vh; padding:0 16px; }
  header { display:flex; justify-content:flex-end; padding:16px 0 0; }
  .langs { display:flex; gap:4px; background:var(--chip); border-radius:999px; padding:4px; }
  .langs button { font:inherit; font-weight:700; font-size:13px; letter-spacing:.08em; color:var(--muted); background:transparent;
                  border:0; border-radius:999px; min-width:44px; min-height:36px; padding:0 12px; cursor:pointer; }
  .langs button[aria-pressed="true"] { background:#fff; color:var(--ink); box-shadow:inset 0 0 0 2px var(--cyan); }
  .langs button:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:26px; padding:40px 0 56px; }
  .logo { width:min(380px,78vw); height:auto; display:block; }
  .slogan { margin:0; font-weight:700; font-size:13px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted); }
  .rule { width:56px; height:3px; border-radius:2px; background:linear-gradient(90deg,var(--cyan),var(--aqua)); border:0; margin:6px 0; }
  h1 { margin:0; font-family:'Fraunces',Georgia,serif; font-weight:500; font-size:clamp(26px,4vw,34px); letter-spacing:-.01em; }
  .what { margin:0; font-weight:500; font-size:16px; line-height:1.6; max-width:560px; }
  .pillars { display:flex; flex-direction:column; gap:10px; width:min(560px,100%); }
  .row { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .row li { display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 10px;
            border-radius:14px; font-weight:700; font-size:14px; letter-spacing:.02em; }
  .row.health li { background:#EEF3F5; border:1px solid #DFE7EA; color:var(--ink); }
  .row.tech li { color:var(--ink); border:1px solid transparent; } .row.tech li:nth-child(1) { background:#DFF6FB; border-color:#B9EAF5; } .row.tech li:nth-child(2) { background:#DDF6F5; border-color:#B5EBE8; } .row.tech li:nth-child(3) { background:#DDF7EF; border-color:#B4EDDD; }
  .row li::before { content:""; width:7px; height:7px; border-radius:50%; flex:none; }
  .row.health li::before { background:var(--muted); opacity:.6; }
  .row.tech li:nth-child(1)::before { background:var(--cyan); } .row.tech li:nth-child(2)::before { background:var(--turq); } .row.tech li:nth-child(3)::before { background:var(--aqua); }
  a { color:var(--ink); font-weight:700; text-decoration:none; border-bottom:2px solid var(--cyan); padding-bottom:2px; }
  a:hover { color:#0A7F96; }
  .contact { text-align:center; padding:28px 0 36px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .contact .label { margin:0; font-weight:700; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }
  .contact a { font-family:'Fraunces',Georgia,serif; font-weight:500; font-size:22px; }
  footer { text-align:center; font-size:13px; color:var(--muted); padding:24px 0; border-top:1px solid var(--line); }
  @media (max-width:480px) { .slogan { font-size:11px; letter-spacing:.18em; } .row { gap:8px; } .row li { font-size:12px; padding:0 4px; letter-spacing:0; } .row li::before { display:none; } .pillars { gap:8px; } }
</style>
</head>
<body>
<header>
  <div class="langs" role="group" aria-label="Langue / Language / Idioma">
    <button type="button" data-lang="fr" aria-pressed="true">FR</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
    <button type="button" data-lang="es" aria-pressed="false">ES</button>
  </div>
